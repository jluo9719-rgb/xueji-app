<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学记个人学习备考助手</title>
<style>
[hidden] { display: none !important; }
/* ========== 现代东方书院设计系统 ========== */
:root {
  /* 墨色与宣纸层级 */
  --surface-0: #161412;
  --surface-1: #221E1B;
  --surface-2: #2D2723;
  --surface-3: #F4EFE6;
  --surface-4: #FCF9F2;
  --surface-card: #FFFFFF;

  /* 主题色 */
  --accent: #C8553D;         /* 朱砂红 */
  --accent-hover: #B3462F;
  --accent-soft: rgba(200, 85, 61, 0.1);
  --accent-dim: #4E7D65;     /* 青绿 */
  --accent-dim-soft: rgba(78, 125, 101, 0.12);
  --gold: #D4A574;           /* 泥金 */
  --gold-soft: rgba(212, 165, 116, 0.18);
  --danger: #C93B3B;

  /* 文本与边框 */
  --text-primary: #26231F;
  --text-secondary: #68625B;
  --text-muted: #968F87;
  --border: rgba(45, 42, 38, 0.12);
  --border-strong: rgba(45, 42, 38, 0.22);

  /* 阴影与圆角 */
  --shadow-sm: 0 2px 6px rgba(26, 22, 20, 0.05);
  --shadow-md: 0 6px 20px rgba(26, 22, 20, 0.08);
  --shadow-lg: 0 12px 32px rgba(26, 22, 20, 0.16);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  /* 字体 */
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-serif: "Songti SC", "STSong", "Noto Serif SC", "Microsoft YaHei", serif;
  --font-mono: Consolas, "SFMono-Regular", "Liberation Mono", Menlo, monospace;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  font-family: var(--font-sans);
  background: var(--surface-3);
  color: var(--text-primary);
  line-height: 1.6;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* 宣纸微纹理 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,0.01) 4px),
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.01) 4px);
  pointer-events: none;
  z-index: 9999;
}

/* ========== 顶部导航栏 ========== */
header {
  background: linear-gradient(180deg, var(--surface-1) 0%, var(--surface-2) 100%);
  color: var(--surface-4);
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 2px solid var(--accent);
  position: relative;
  z-index: 40;
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.menu-toggle {
  display: none;
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: var(--surface-4);
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
}

.logo {
  font-family: var(--font-serif);
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.2em;
  white-space: nowrap;
  user-select: none;
}

.current-session-badge {
  font-size: 0.82rem;
  color: rgba(252, 249, 242, 0.78);
  background: rgba(255, 255, 255, 0.08);
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid rgba(212, 165, 116, 0.25);
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav-tabs {
  display: flex;
  gap: 8px;
  height: 100%;
  align-items: center;
}

.nav-tab {
  font-size: 0.92rem;
  color: rgba(252, 249, 242, 0.72);
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}

.nav-tab:hover {
  color: var(--surface-4);
  background: rgba(255, 255, 255, 0.06);
}

.nav-tab.active {
  color: var(--gold);
  background: rgba(212, 165, 116, 0.14);
  font-weight: 600;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.seal {
  width: 34px;
  height: 34px;
  background: var(--accent);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: var(--radius-sm);
  color: var(--surface-4);
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 6px rgba(200, 85, 61, 0.35);
}

.seal:hover {
  transform: translateY(-1px);
  background: var(--accent-hover);
}

/* ========== 主体双栏容器 ========== */
.container {
  display: flex;
  height: calc(100vh - 58px);
  position: relative;
  overflow: hidden;
}

.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 58px 0 0 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 25;
}

/* ========== 左侧会话栏 ========== */
aside {
  width: 268px;
  flex-shrink: 0;
  background: var(--surface-2);
  color: var(--surface-4);
  border-right: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  flex-direction: column;
  z-index: 30;
  transition: transform 0.25s ease;
}

.aside-header {
  padding: 16px 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.new-btn {
  background: var(--accent);
  color: var(--surface-4);
  border: none;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 2px 8px rgba(200, 85, 61, 0.3);
}

.new-btn:hover:not(:disabled) {
  background: var(--accent-hover);
  transform: translateY(-1px);
}

.new-btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.aside-filter-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.78rem;
  color: rgba(252, 249, 242, 0.65);
}

.archive-toggle-btn {
  background: rgba(255, 255, 255, 0.07);
  color: var(--gold);
  border: 1px solid rgba(212, 165, 116, 0.3);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.2s;
}

.archive-toggle-btn:hover {
  background: rgba(212, 165, 116, 0.18);
}

#timeline {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px 20px;
}

.timeline-section {
  margin-bottom: 16px;
}

.timeline-label {
  font-size: 0.75rem;
  color: var(--gold);
  letter-spacing: 0.08em;
  padding: 4px 8px;
  opacity: 0.85;
  display: flex;
  align-items: center;
  gap: 8px;
}

.timeline-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(212, 165, 116, 0.2);
}

.session-item {
  padding: 9px 10px;
  margin: 4px 0;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.18s;
  border-left: 3px solid transparent;
  background: rgba(255, 255, 255, 0.02);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.session-item:hover {
  background: rgba(255, 255, 255, 0.07);
  border-left-color: var(--gold);
}

.session-item.active {
  background: var(--surface-1);
  border-left-color: var(--accent);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.session-main-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.session-title {
  font-size: 0.88rem;
  color: var(--surface-4);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}

.session-time {
  font-size: 0.72rem;
  color: rgba(252, 249, 242, 0.45);
  flex-shrink: 0;
}

.session-actions {
  display: flex;
  gap: 4px;
  opacity: 0.65;
  transition: opacity 0.15s;
}

.session-item:hover .session-actions,
.session-item.active .session-actions {
  opacity: 1;
}

.session-act-btn {
  background: rgba(255, 255, 255, 0.06);
  color: rgba(252, 249, 242, 0.82);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 4px;
  padding: 2px 7px;
  font-size: 0.72rem;
  cursor: pointer;
  transition: all 0.15s;
}

.session-act-btn:hover {
  background: rgba(255, 255, 255, 0.16);
  color: #fff;
}

.session-act-btn.danger:hover {
  background: rgba(201, 59, 59, 0.35);
  border-color: #e06c6c;
  color: #ffdada;
}

/* ========== 主工作区 ========== */
main {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--surface-4);
  min-width: 0;
}

.view {
  display: none;
  flex: 1;
  overflow: hidden;
}

.view.active {
  display: flex;
  flex-direction: column;
}

/* 通用按钮 */
.btn-secondary {
  padding: 6px 13px;
  background: var(--surface-card);
  color: var(--text-primary);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.18s;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.btn-secondary:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}

.btn-secondary.primary-outline {
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}

.btn-secondary.primary-outline:hover:not(:disabled) {
  background: var(--accent);
  color: #fff;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

/* ========== 聊天视图：顶部资料面板 ========== */
.documents-panel {
  flex-shrink: 0;
  background: var(--surface-3);
  border-bottom: 1px solid var(--border);
  transition: all 0.2s;
}

.documents-panel summary {
  list-style: none;
  cursor: pointer;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  user-select: none;
  font-size: 0.88rem;
  font-weight: 600;
}

.documents-panel summary::-webkit-details-marker {
  display: none;
}

.doc-summary-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.doc-badge {
  font-size: 0.75rem;
  font-weight: 500;
  padding: 2px 9px;
  border-radius: 999px;
  background: rgba(45, 42, 38, 0.08);
  color: var(--text-secondary);
}

.doc-badge.ready {
  background: var(--accent-dim-soft);
  color: var(--accent-dim);
}

.doc-badge.processing {
  background: var(--gold-soft);
  color: #8c5d28;
}

.doc-summary-toggle {
  font-size: 0.78rem;
  color: var(--text-secondary);
  font-weight: 400;
}

.documents-body {
  padding: 0 20px 14px;
  border-top: 1px dashed var(--border);
}

.document-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 10px;
  padding: 10px 14px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.55);
  transition: border-color 0.2s, background 0.2s;
}

.document-toolbar.dragover {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.document-toolbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.document-hint {
  font-size: 0.78rem;
  color: var(--text-secondary);
}

#uploadStatus {
  margin-top: 8px;
  padding: 4px 0;
  color: var(--text-secondary);
  font-size: 0.8rem;
}

#documentList {
  max-height: 150px;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8px;
  margin-top: 6px;
}

.document-empty {
  grid-column: 1 / -1;
  font-size: 0.82rem;
  color: var(--text-muted);
  padding: 6px 2px;
}

.document-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 10px;
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.82rem;
}

.doc-info {
  flex: 1;
  min-width: 0;
}

.doc-name {
  font-weight: 500;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: block;
}

.doc-state {
  font-size: 0.74rem;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 2px;
}

.doc-state.ready { color: var(--accent-dim); }
.doc-state.error { color: var(--danger); }
.doc-state.processing { color: #9c682d; }

.doc-progress-bar {
  width: 60px;
  height: 4px;
  background: rgba(0, 0, 0, 0.08);
  border-radius: 999px;
  overflow: hidden;
}

.doc-progress-inner {
  height: 100%;
  background: var(--gold);
  transition: width 0.3s;
}

/* ========== 聊天消息列表 ========== */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  max-width: 960px;
  margin: 0 auto;
  width: 100%;
  scroll-behavior: smooth;
}

.chat-empty {
  text-align: center;
  color: var(--text-secondary);
  padding: 48px 20px;
  max-width: 480px;
  margin: 20px auto;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
}

.chat-empty-title {
  font-family: var(--font-serif);
  font-size: 1.15rem;
  color: var(--text-primary);
  margin-bottom: 8px;
  font-weight: 600;
}

.chat-empty-sub {
  font-size: 0.85rem;
  color: var(--text-secondary);
  line-height: 1.7;
}

.message {
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.message.user {
  align-items: flex-end;
}

.message-role-tag {
  font-size: 0.74rem;
  color: var(--text-muted);
  margin-bottom: 4px;
  padding: 0 4px;
}

.message-content {
  max-width: 85%;
  padding: 14px 18px;
  border-radius: var(--radius-md);
  font-size: 0.94rem;
  line-height: 1.75;
  position: relative;
  word-break: break-word;
}

.message.user .message-content {
  background: linear-gradient(135deg, var(--surface-2), var(--surface-1));
  color: var(--surface-4);
  border: 1px solid rgba(212, 165, 116, 0.3);
  border-bottom-right-radius: 3px;
  box-shadow: var(--shadow-sm);
}

.message.assistant .message-content {
  background: var(--surface-card);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-bottom-left-radius: 3px;
  box-shadow: var(--shadow-sm);
}

.message-footer {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  flex-wrap: wrap;
}

/* 手动收录错题按钮 */
.cap-btn {
  padding: 4px 11px;
  background: var(--surface-3);
  color: var(--text-secondary);
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  font-size: 0.76rem;
  cursor: pointer;
  transition: all 0.2s;
}

.cap-btn:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}

.cap-btn[aria-pressed="true"] {
  background: var(--accent-dim-soft);
  color: var(--accent-dim);
  border-color: var(--accent-dim);
}

/* 通用知识确认框 */
.needs-general-box {
  margin-top: 12px;
  padding: 10px 12px;
  background: var(--gold-soft);
  border-left: 3px solid var(--gold);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.needs-general-hint {
  font-size: 0.8rem;
  color: var(--text-secondary);
}

/* ========== 检索步骤条 ========== */
.chat-steps {
  max-width: 960px;
  width: 100%;
  margin: 0 auto;
  padding: 8px 20px;
  background: var(--surface-3);
  border-top: 1px solid var(--border);
}

.steps {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
}

.step {
  padding: 3px 10px;
  font-size: 0.76rem;
  border-radius: 999px;
  background: var(--surface-card);
  color: var(--text-muted);
  border: 1px solid var(--border);
  transition: all 0.2s;
}

.step.active {
  background: var(--accent-dim);
  color: #fff;
  border-color: var(--accent-dim);
  font-weight: 600;
}

.step.done {
  background: var(--accent-dim-soft);
  color: var(--accent-dim);
  border-color: rgba(78, 125, 101, 0.3);
}

.steps-detail {
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-top: 4px;
  text-align: center;
}

/* ========== 底部输入区 ========== */
.chat-input-area {
  max-width: 960px;
  width: 100%;
  margin: 0 auto;
  padding: 12px 20px 16px;
  border-top: 1px solid var(--border);
  background: var(--surface-4);
}

.chat-input-box {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  background: var(--surface-card);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 8px 10px 8px 14px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.chat-input-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

#chatInput {
  flex: 1;
  border: none;
  background: transparent;
  font-family: var(--font-sans);
  font-size: 0.94rem;
  color: var(--text-primary);
  resize: none;
  min-height: 28px;
  max-height: 160px;
  line-height: 1.6;
  padding: 4px 0;
}

#chatInput:focus {
  outline: none;
}

#sendBtn {
  padding: 8px 20px;
  background: var(--accent);
  color: var(--surface-4);
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  height: 38px;
}

#sendBtn:hover:not(:disabled) {
  background: var(--accent-hover);
}

/* ========== 错题本视图 ========== */
#mistakes-view {
  padding: 20px;
  max-width: 1060px;
  margin: 0 auto;
  width: 100%;
}

.mistakes-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}

.mistakes-filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.filter-pill {
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 0.82rem;
  background: var(--surface-3);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
}

.filter-pill.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-weight: 600;
}

.mistakes-stats {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-left: 6px;
}

.mistakes-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.mistakes-list {
  flex: 1;
  overflow-y: auto;
  padding-right: 4px;
}

.mistake-card {
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.2s;

<!-- 顶栏 -->
<header>
  <div class="header-left">
    <button class="menu-toggle" id="menuToggleBtn" aria-label="切换会话列表" title="会话列表">☰</button>

  <main>

          <button class="filter-pill" data-status="未掌握">未掌握</button>

      </div>

    </div>

<script>
// ========== 全局状态 ==========
let currentSession = '';
let chatController = null;
let initialized = false;
let currentSessionTitle = '正在恢复对话…';
let showArchived = false;
let currentView = 'chat';
let captureItems = [];
let mistakeFilterStatus = '';
let lastQuestion = '';
let lastExamMarkdown = '';
let capturePending = false;
let busy = false;   // 回答生成中：禁止重复发送 / 切换会话

// ========== 工具函数 ==========
const API_BASE = '';  // 同源

async function apiCall(url, options = {}) {
  const res = await fetch(API_BASE + url, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...options.headers,
    },
  });
  if (!res.ok) {
    let errText = await res.text();
    try {
      const errJson = JSON.parse(errText);
      if (errJson.detail) errText = errorDetail(errJson.detail);
    } catch (_) {}
    throw new Error(errText);
  }
  return res.json();
}

function errorDetail(detail) {
  if (typeof detail === 'string') return detail;
  if (detail && detail.message) {
    const reasons = (detail.rejection_reasons || []).map(r => r.reason);
    return detail.message + (reasons.length ? '：' + [...new Set(reasons)].join('；') : '');
  }
  if (Array.isArray(detail)) return detail.map(x => x.msg || String(x)).join('；');
  return '请求失败，请检查输入后重试';
}

function rememberSession() {
  try { localStorage.setItem('xueji.currentSession', currentSession); } catch (_) {}
}

function clearExam() {
  lastExamMarkdown = '';
  document.getElementById('examPreview').textContent = '请配置出题方式后开始出题';
  document.getElementById('copyExamBtn').disabled = true;
  document.getElementById('downloadExamBtn').disabled = true;
}

function parseTs(s) {
  if (!s) return null;
  const d = new Date(String(s).replace(' ', 'T'));
  return isNaN(d) ? null : d;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function inlineMd(s) {
  return s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g,
             '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

function mdToHtml(md) {
  const lines = escapeHtml(md || '').split('\n');
  const out = [];
  let listType = null;
  let inCode = false;
  const codeBuf = [];

  const closeList = () => {
    if (listType) { out.push(listType === 'ul' ? '</ul>' : '</ol>'); listType = null; }
  };

  for (const raw of lines) {
    const t = raw.trim();
    if (/^```/.test(t)) {
      if (inCode) {
        out.push('<pre><code>' + codeBuf.join('\n') + '</code></pre>');
        codeBuf.length = 0;
        inCode = false;
      } else {
        closeList();
        inCode = true;
      }
      continue;
    }
    if (inCode) { codeBuf.push(raw); continue; }
    if (!t) { closeList(); continue; }

    let m;
    if ((m = t.match(/^(#{1,4})\s+(.*)$/))) {
      closeList();
      const lv = m[1].length;
      out.push(`<h${lv}>${inlineMd(m[2])}</h${lv}>`);
    } else if ((m = t.match(/^[-*+]\s+(.*)$/))) {
      if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
      out.push(`<li>${inlineMd(m[1])}</li>`);
    } else if ((m = t.match(/^\d+[.、]\s*(.*)$/))) {
      if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
      out.push(`<li>${inlineMd(m[1])}</li>`);
    } else if ((m = t.match(/^>\s?(.*)$/))) {
      closeList();
      out.push(`<blockquote>${inlineMd(m[1])}</blockquote>`);
    } else if (/^(\*\*\*|---|___)$/.test(t)) {
      closeList();
      out.push('<hr>');
    } else {
      closeList();
      out.push(`<p>${inlineMd(t)}</p>`);
    }
  }
  if (inCode && codeBuf.length) {
    out.push('<pre><code>' + codeBuf.join('\n') + '</code></pre>');
  }
  closeList();
  return out.join('');
}

let toastTimer = null;
function toast(msg) {
  let el = document.querySelector('.toast');
  if (!el) {
    el = document.createElement('div');

  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// ========== 会话时间线 ==========
function updateSessionBadge() {
  const badge = document.getElementById('currentSessionBadge');
  badge.textContent = currentSessionTitle || ('对话 ' + currentSession.slice(0, 6));
}

async function loadTimeline() {
  try {
    const data = await apiCall('/sessions');
    const timeline = document.getElementById('timeline');
    const allSessions = data.sessions || [];

    const matchedCurrent = allSessions.find(s => s.id === currentSession);
    if (matchedCurrent) {
      currentSessionTitle = matchedCurrent.title || ('对话 ' + matchedCurrent.id.slice(0, 6));
    } else if (currentSession === 'default') {
      currentSessionTitle = '默认对话';
    }
    updateSessionBadge();

    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const yesterday = new Date(today - 24 * 3600 * 1000);
    const weekStart = new Date(today - (today.getDay() || 7) * 24 * 3600 * 1000);

    const groups = { today: [], yesterday: [], week: [], older: [] };

    allSessions.filter(s => Boolean(s.archived) === showArchived).forEach(s => {
      const t = parseTs(s.updated_at || s.created_at);
      if (!t) { groups.older.push(s); return; }
      if (t >= today) groups.today.push(s);
      else if (t >= yesterday) groups.yesterday.push(s);
      else if (t >= weekStart) groups.week.push(s);
      else groups.older.push(s);
    });

    timeline.innerHTML = '';
    const labels = { today: '今日', yesterday: '昨日', week: '本周', older: '更早' };
    let renderedCount = 0;

    Object.entries(groups).forEach(([key, sessions]) => {
      if (sessions.length === 0) return;
      renderedCount += sessions.length;

      const section = document.createElement('div');
      section.className = 'timeline-section';
      section.innerHTML = `<h3 class="timeline-label">${labels[key]}</h3>`;

      sessions.forEach(s => {
        const item = document.createElement('div');
        item.className = 'session-item' + (s.id === currentSession ? ' active' : '');
        item.dataset.sid = s.id;

        const t = parseTs(s.updated_at || s.created_at);
        const timeStr = t
          ? `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`
          : '';

        const mainRow = document.createElement('div');
        mainRow.className = 'session-main-row';

        const title = document.createElement('span');
        title.className = 'session-title';
        title.textContent = s.title || ('对话 ' + s.id.slice(0, 6));

        const time = document.createElement('span');
        time.className = 'session-time';
        time.textContent = timeStr;

        mainRow.append(title, time);
        item.appendChild(mainRow);

        const actions = document.createElement('div');
        actions.className = 'session-actions';
        const actConfig = [
          ['重命名', 'rename', ''],
          [s.archived ? '恢复' : '归档', 'archive', ''],
          ['删除', 'delete', 'danger']
        ];

        for (const [label, action, extraCls] of actConfig) {
          const button = document.createElement('button');
          button.className = 'session-act-btn' + (extraCls ? ' ' + extraCls : '');
          button.textContent = label;
          button.onclick = async event => {
            event.stopPropagation();
            if (!initialized || busy || capturePending) return toast('请等待当前操作完成');
            try {
              if (action === 'rename') {
                const newTitle = prompt('输入对话名称（1～100字）', s.title);
                if (newTitle === null) return;
                await apiCall('/sessions/' + encodeURIComponent(s.id), {
                  method: 'PATCH',
                  body: JSON.stringify({ title: newTitle })
                });
                toast('已重命名');
              } else if (action === 'archive') {
                await apiCall('/sessions/' + encodeURIComponent(s.id), {
                  method: 'PATCH',
                  body: JSON.stringify({ archived: !s.archived })
                });
                toast(s.archived ? '已恢复到进行中' : '已归档');
              } else {
                if (!confirm('删除此对话及其上传资料、向量索引和来源错题？此操作不可撤销。')) return;
                await apiCall('/sessions/' + encodeURIComponent(s.id), { method: 'DELETE' });
                toast('已删除对话');
                if (currentSession === s.id) {
                  currentSession = 's_' + Date.now();
                  currentSessionTitle = '新对话';
                  rememberSession();
                  clearExam();
                  await apiCall('/sessions', {
                    method: 'POST',
                    body: JSON.stringify({ session_id: currentSession, title: '新对话' })
                  });
                  showEmptyHint();
                  loadDocuments();
                }
              }
              await loadTimeline();
            } catch (e) {
              toast('操作失败：' + e.message);
            }
          };
          actions.append(button);
        }
        item.append(actions);
        item.addEventListener('click', () => {
          switchSession(s.id);
          toggleSidebar(false);
        });
        section.appendChild(item);
      });

      timeline.appendChild(section);
    });

    if (renderedCount === 0) {
      timeline.innerHTML = `<div style="text-align:center;color:rgba(252,249,242,0.45);font-size:0.82rem;padding:28px 10px">${showArchived ? '暂无已归档对话' : '暂无对话记录，点击上方“新对话”开始'}</div>`;
    }
  } catch (e) {
    console.error('加载时间线失败:', e);
  }
}

async function loadChatMessages() {
  const sid = currentSession;
  const box = document.getElementById('chatMessages');
  box.innerHTML = '';
  try {
    const data = await apiCall(`/sessions/${encodeURIComponent(currentSession)}/messages`);
    const saved = await apiCall('/mistakes').catch(() => ({ items: [] }));
    if (sid !== currentSession || busy) return;
    captureItems = saved.items || [];
    lastQuestion = '';
    const msgs = data.messages || [];
    if (!msgs.length) { showEmptyHint(); return; }
    for (const [index, m] of msgs.entries()) {
      if (m.role === 'system' || (m.role === 'user' && typeof m.content === 'string' && m.content.startsWith('请结合这个新线索继续检索：'))) continue;
      if (typeof m.content === 'string' && m.content) {
        if (m.meta && m.meta.mode === 'no_evidence') {
          showGeneralPrompt(m.content, m.meta.question, index === msgs.length - 1);
        } else addBubble(m.role, m.content);
      }
    }
  } catch (e) {
    console.warn('加载会话消息失败:', e.message);
    showEmptyHint();
  }
}

/* ---------- 发送与 SSE 解析 ---------- */
async function sendMessage(options = {}) {
  const input = document.getElementById('chatInput');
  const question = options.question || input.value.trim();
  if (!initialized || !question || busy || capturePending) return;

  busy = true;
  document.getElementById('sendBtn').disabled = true;
  if (!options.question) {
    input.value = '';
    input.style.height = 'auto';
  }
  doneStages.clear();
  document.querySelectorAll('.general-confirm').forEach(b => { b.disabled = true; });
  if (!options.reuseQuestion) addBubble('user', question);
  else lastQuestion = question;
  chatController = new AbortController();
  stopBtn.hidden = false;
  showStatus('start', '正在连接服务…');
  let receivedAnswer = false;

  try {
    const resp = await fetch('/chat', {
      signal: chatController.signal,
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: question,
        session_id: currentSession,
        allow_general: options.allow_general === true
      })
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        if (handleSSE(chunk) === 'answer') receivedAnswer = true;
      }
    }
  } catch (e) {
    addBubble('assistant', e.name === 'AbortError' ? '已停止本轮回答，未完成的回答不会保存。' : '请求失败：' + e.message, false);
  } finally {
    busy = false;
    chatController = null;
    stopBtn.hidden = true;
    if (options.reuseQuestion && !receivedAnswer) {
      const buttons = document.querySelectorAll('.general-confirm');
      if (buttons.length) buttons[buttons.length - 1].disabled = false;
    }
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('chatSteps').style.display = 'none';
    document.getElementById('statusDetail').textContent = '';
    loadTimeline();
  }
}

function handleSSE(chunk) {
  let event = 'message', data = '';
  for (const line of chunk.split('\n')) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trim();
  }
  if (!data) return;
  try {
    const d = JSON.parse(data);
    if (event === 'status') showStatus(d.stage, d.detail);
    else if (event === 'answer') addBubble('assistant', d.text);
    else if (event === 'needs_general') showGeneralPrompt(d.message, d.question);
    else if (event === 'error') addBubble('assistant', '⚠️ ' + d.message, false);
    return event;
  } catch (_) {}
}

/* ---------- 手动收录错题 ---------- */
function updateCaptureButton(btn) {
  const data = btn.capture;
  const matches = captureItems.filter(m =>
    m.session_id === data.session_id &&
    m.question === data.question &&
    m.answer === data.answer.slice(0, 3000)
  );
  btn.mistakeIds = matches.map(m => m.id);
  btn.textContent = matches.length ? '✓ 已收录 · 点击取消' : '＋ 收录错题本';
  btn.setAttribute('aria-pressed', String(matches.length > 0));
}

function syncCaptureButtons() {
  document.querySelectorAll('.cap-btn').forEach(updateCaptureButton);
}

async function captureMistake(btn) {
  if (!initialized || busy || capturePending) return toast('请等待当前操作完成');
  capturePending = true;
  btn.disabled = true;
  const cancelling = btn.mistakeIds.length > 0;
  btn.textContent = cancelling ? '正在取消…' : '正在收录…';
  try {
    if (cancelling) {
      for (const id of btn.mistakeIds) await apiCall('/mistakes/' + id, { method: 'DELETE' });
      captureItems = captureItems.filter(m => !btn.mistakeIds.includes(m.id));
      toast('已取消收录');
    } else {
      const card = await apiCall('/mistakes', {
        method: 'POST',
        body: JSON.stringify(btn.capture)
      });
      captureItems.push(card);
      toast('已收录到错题本，可再次点击取消');
    }
  } catch (e) {
    toast((cancelling ? '取消失败：' : '收录失败：') + e.message);
  } finally {
    capturePending = false;
    btn.disabled = false;
    syncCaptureButtons();
  }
}

// ========== 学习资料上传与管理 ==========
let documentsTimer;
async function loadDocuments() {
  clearTimeout(documentsTimer);
  const list = document.getElementById('documentList');
  const badge = document.getElementById('docCountBadge');
  try {
    const sid = currentSession;
    const data = await apiCall('/documents?session_id=' + encodeURIComponent(sid));
    if (sid !== currentSession) return;
    list.replaceChildren();
    const docs = data.docs || [];

    const readyCount = docs.filter(d => d.status === 'ready').length;
    const procCount = docs.filter(d => d.status === 'processing').length;
    if (!docs.length) {
      badge.className = 'doc-badge';
      badge.textContent = '暂无资料';
      const empty = document.createElement('div');
      empty.className = 'document-empty';
      empty.textContent = '当前对话还没有资料，点击“上传文件”或将文件拖拽至上方虚线框添加。';
      list.appendChild(empty);
    } else if (procCount > 0) {
      badge.className = 'doc-badge processing';
      badge.textContent = `${readyCount}/${docs.length} 已就绪 · 处理中`;
    } else {
      badge.className = 'doc-badge ready';
      badge.textContent = `${readyCount} 份资料已就绪`;
    }

    for (const doc of docs) {
      const row = document.createElement('div');
      row.className = 'document-row';

      const info = document.createElement('div');
      info.className = 'doc-info';

      const nameEl = document.createElement('span');
      nameEl.className = 'doc-name';
      nameEl.title = doc.name;
      nameEl.textContent = doc.name;

      const stateEl = document.createElement('div');
      const statusCls = doc.status === 'ready' ? 'ready' : doc.status === 'error' ? 'error' : 'processing';
      stateEl.className = 'doc-state ' + statusCls;

      const stateText = doc.status === 'ready'
        ? '● 已就绪'
        : doc.status === 'error'
          ? '✕ 处理失败：' + (doc.error || '请重新上传')
          : `${doc.stage || '处理中'} ${doc.progress || 0}%`;

      stateEl.appendChild(document.createTextNode(stateText));

      if (doc.status === 'processing') {
        const bar = document.createElement('div');
        bar.className = 'doc-progress-bar';
        const inner = document.createElement('div');
        inner.className = 'doc-progress-inner';
        inner.style.width = `${Math.min(100, Math.max(5, doc.progress || 0))}%`;
        bar.appendChild(inner);
        stateEl.appendChild(bar);
      }

      info.append(nameEl, stateEl);
      row.appendChild(info);

      const remove = document.createElement('button');
      remove.className = 'btn-secondary';
      remove.style.padding = '3px 9px';
      remove.style.fontSize = '0.76rem';
      remove.textContent = '删除';
      remove.disabled = doc.status === 'processing';
      remove.onclick = async () => {
        if (!initialized || busy || capturePending) return toast('请等待当前操作完成');
        if (!confirm('删除资料“' + doc.name + '”？这会移除原件和知识库索引。')) return;
        remove.disabled = true;
        try {
          await apiCall('/documents/' + encodeURIComponent(doc.doc_id) + '?session_id=' + encodeURIComponent(sid), { method: 'DELETE' });
          toast('资料已删除');
          await loadDocuments();
        } catch (e) {
          toast('删除失败：' + e.message);
          remove.disabled = false;
        }
      };
      const rebuild = document.createElement('button');
      rebuild.className = 'btn-secondary';
      rebuild.textContent = doc.index_version === 'heading-v2' ? '重建索引' : '升级索引';
      rebuild.disabled = doc.status === 'processing';
      rebuild.onclick = async () => {
        if (!initialized || busy || capturePending) return toast('请等待当前操作完成');
        rebuild.disabled = true;
        try {
          await apiCall('/documents/' + encodeURIComponent(doc.doc_id) + '/rebuild?session_id=' + encodeURIComponent(sid), {method:'POST'});
          toast('已开始重建，原件保留，旧回答的块编号仅代表旧版资料');
          await loadDocuments();
        } catch (e) { toast('重建失败：' + e.message); rebuild.disabled = false; }
      };
      row.append(rebuild, remove);
      list.appendChild(row);
    }

    if (docs.some(d => d.status === 'processing')) {
      documentsTimer = setTimeout(loadDocuments, 2000);
    }
  } catch (e) {
    list.textContent = '资料列表加载失败，请点击刷新：' + e.message;
  }
}

async function handleFilesUpload(fileList) {
  if (!initialized) return toast('请等待对话初始化完成');
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const uploadSession = currentSession;
  const button = document.getElementById('uploadDocumentBtn');
  const status = document.getElementById('uploadStatus');
  button.disabled = true;
  let accepted = 0, duplicates = 0;
  const failures = [];
  try {
    for (const file of files) {
      if (!/\.(txt|md|pdf|docx)$/i.test(file.name) || file.size > 200 * 1024 * 1024 || !file.size) {
        failures.push(file.name + '：格式不支持、文件为空或超过 200MB');
        continue;
      }
      status.textContent = '正在上传：' + file.name;
      const body = new FormData();
      body.append('file', file);
      try {
        const res = await fetch('/documents?session_id=' + encodeURIComponent(uploadSession), { method: 'POST', body });
        const result = await res.json();
        if (!res.ok) throw new Error(errorDetail(result.detail));
        if (result.duplicate) duplicates++; else accepted++;
      } catch (e) {
        failures.push(file.name + '：' + e.message);
      }
    }
    const failMsg = failures.length ? '；失败：' + failures.join('；') : '';
    status.textContent = `新接收 ${accepted} 个文件，跳过 ${duplicates} 个重复文件。请等状态显示“已就绪”后提问${failMsg}`;
    await loadDocuments();
  } finally {
    button.disabled = false;
    document.getElementById('documentInput').value = '';
  }
}

document.getElementById('refreshDocumentsBtn').onclick = loadDocuments;
document.getElementById('uploadDocumentBtn').onclick = () => document.getElementById('documentInput').click();
document.getElementById('documentInput').onchange = e => handleFilesUpload(e.target.files);

const dropZone = document.getElementById('dropZone');
['dragenter', 'dragover'].forEach(evt => {

['dragleave', 'drop'].forEach(evt => {

async function loadMistakes() {
  try {
    const query = mistakeFilterStatus ? `?status=${encodeURIComponent(mistakeFilterStatus)}` : '';
    const data = await apiCall('/mistakes' + query);
    let items = data.items || [];
    if (!mistakeFilterStatus) {
      captureItems = items;
      syncCaptureButtons();
    }

    const onlyCurrent = document.getElementById('onlyCurrentSessionMistakes').checked;
    if (onlyCurrent) {
      items = items.filter(m => m.session_id === currentSession);
    }

    const stats = {total: items.length, learned: items.filter(m => m.status === '已掌握').length, unlearned: items.filter(m => m.status !== '已掌握').length};
    document.getElementById('mistakesStats').textContent = stats.total
      ? `当前筛选 ${stats.total} 题（未掌握 ${stats.unlearned} · 已掌握 ${stats.learned}）`
      : '错题本为空';

    const list = document.getElementById('mistakesList');
    list.innerHTML = '';

    if (!items.length) {
      list.innerHTML = '<div class="chat-empty">' +
        '<div class="chat-empty-title">暂无符合条件的错题卡片</div>' +
        '<div class="chat-empty-sub">在聊天回答下方点击「＋ 收录错题本」即可提炼薄弱点卡片；收录后也可随时取消或标记掌握状态。</div>' +
      '</div>';
      return;
    }

    items.forEach(mk => {
      const learned = mk.status === '已掌握';
      const card = document.createElement('div');
      card.className = 'mistake-card' + (learned ? ' is-learned' : '');

      const header = document.createElement('div');
      header.className = 'mistake-card-header';

      const topic = document.createElement('div');
      topic.className = 'mistake-topic';
      topic.textContent = mk.topic || '（无主题）';

      const badge = document.createElement('span');
      badge.className = 'mistake-badge ' + (learned ? 'learned' : 'unlearned');
      badge.textContent = mk.status;

      header.append(topic, badge);

      const confusion = document.createElement('div');
      confusion.className = 'mistake-confusion';
      confusion.textContent = mk.confusion || '';

      const detail = document.createElement('div');
      detail.className = 'mistake-detail';

      const qRow = document.createElement('div');
      qRow.className = 'mistake-detail-row';
      qRow.innerHTML = '<span class="mistake-detail-label">问：</span>';
      qRow.appendChild(document.createTextNode(mk.question || ''));

      const aRow = document.createElement('div');
      aRow.className = 'mistake-detail-row';
      aRow.innerHTML = '<span class="mistake-detail-label">答：</span>';
      aRow.appendChild(document.createTextNode(
        mk.answer ? (mk.answer.length > 500 ? mk.answer.slice(0, 500) + '……' : mk.answer) : ''
      ));
      detail.append(qRow, aRow);

      const footerBar = document.createElement('div');
      footerBar.className = 'mistake-footer-bar';

      const meta = document.createElement('div');
      meta.className = 'mistake-meta';
      const t = parseTs(mk.created_at);
      meta.textContent = [
        mk.session_title ? `来源：${mk.session_title}` : '',
        t ? t.toLocaleDateString() : '',
        '点击卡片展开问答详情'
      ].filter(Boolean).join(' · ');

      const actions = document.createElement('div');
      actions.className = 'card-actions';

      // 切换已掌握 / 未掌握状态
      const toggleStatusBtn = document.createElement('button');
      toggleStatusBtn.className = 'btn-secondary';
      toggleStatusBtn.textContent = learned ? '标为未掌握' : '✓ 标为已掌握';
      toggleStatusBtn.onclick = async event => {
        event.stopPropagation();
        toggleStatusBtn.disabled = true;
        const targetStatus = learned ? '未掌握' : '已掌握';
        try {
          await apiCall(`/mistakes/${mk.id}/status`, {
            method: 'PUT',
            body: JSON.stringify({ status: targetStatus })
          });
          toast(`已标记为「${targetStatus}」`);
          await loadMistakes();
        } catch (e) {
          toast('状态更新失败：' + e.message);
          toggleStatusBtn.disabled = false;
        }
      };

      const remove = document.createElement('button');
      remove.className = 'btn-secondary';
      remove.textContent = '取消收录';
      remove.onclick = async event => {
        event.stopPropagation();
        remove.disabled = true;
        try {
          await apiCall('/mistakes/' + mk.id, { method: 'DELETE' });
          await loadMistakes();
          toast('已取消收录');
        } catch (e) {
          toast('取消失败：' + e.message);
          remove.disabled = false;
        }
      };

      actions.append(toggleStatusBtn, remove);
      footerBar.append(meta, actions);

      card.append(header, confusion, detail, footerBar);
      card.addEventListener('click', () => card.classList.toggle('expanded'));
      list.appendChild(card);
    });
  } catch (e) {
    console.error('加载错题本失败:', e);
  }
}

document.getElementById('generateFromMistakesBtn').addEventListener('click', async () => {

  if (checked.length === 0) {
    toast('请至少选择一个错题');
    return;
  }

  const countPer = parseInt(document.getElementById('countPerMistake').value);
  const btn = document.getElementById('generateFromMistakesBtn');

  if (!initialized || busy || capturePending) return toast('请等待当前操作完成');
  busy = true;
  clearExam();
  document.getElementById('examPreview').textContent = '正在检索资料、生成题目并审题，请稍候…';
  btn.disabled = true;
  btn.textContent = '出题与审题中…（耗时较长）';
  try {
    const data = await apiCall('/exam/from-mistakes', {
      method: 'POST',
      body: JSON.stringify({ mistake_ids: checked, count_per: countPer, session_id: currentSession })
    });
    displayExam(data);
    toast(`试卷生成完成，共 ${data.count || ''} 题`);
  } catch (e) {

    btn.disabled = false;

  }
});

function displayExam(data) {
  lastExamMarkdown = data.markdown || '';
  const preview = document.getElementById('examPreview');
  preview.innerHTML = '';
  const notice = document.createElement('p');
  notice.textContent = `请求 ${data.requested} 题，生成 ${data.count} 题，丢弃 ${data.rejected || 0} 题。` +
    (data.review_status === 'unreviewed' ? '包含未审核题目，请核对答案。' : '本次显示题目已通过模型审题，仍请核对原文。');
  const body = document.createElement('div');
  body.className = 'md-body';
  body.innerHTML = mdToHtml(data.question_markdown);
  const details = document.createElement('details');
  details.className = 'exam-answers';
  const summary = document.createElement('summary');
  summary.style.cssText = 'cursor:pointer;padding:14px 0;font-weight:600';
  summary.textContent = '完成练习后，点击查看答案与解析';
  const answers = document.createElement('div');
  answers.className = 'md-body';
  answers.innerHTML = mdToHtml(data.answer_markdown);
  details.append(summary, answers);
  preview.append(notice, body, details);
  document.getElementById('copyExamBtn').disabled = !lastExamMarkdown;
  document.getElementById('downloadExamBtn').disabled = !lastExamMarkdown;
}

document.getElementById('copyExamBtn').addEventListener('click', async () => {
  if (!lastExamMarkdown) return;
  try {
    await navigator.clipboard.writeText(lastExamMarkdown);
    toast('试卷 Markdown 已复制到剪贴板');
  } catch (_) {
    toast('复制失败，请手动选择复制');
  }
});

document.getElementById('downloadExamBtn').addEventListener('click', () => {
  if (!lastExamMarkdown) return;
  const blob = new Blob([lastExamMarkdown], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `练习试卷_${new Date().toISOString().slice(0, 10)}.md`;
  a.click();
  URL.revokeObjectURL(url);
});

// ========== 初始化 ==========
async function initialize() {
  document.getElementById('sendBtn').disabled = true;
  try {
    const data = await apiCall('/sessions');
    const sessions = data.sessions || [];
    let remembered = '';
    try { remembered = localStorage.getItem('xueji.currentSession') || ''; } catch (_) {}
    const selected = sessions.find(s => s.id === remembered) || sessions.find(s => !s.archived);
    if (selected) {
      currentSession = selected.id;
      currentSessionTitle = selected.title;
      showArchived = Boolean(selected.archived);
    } else {
      currentSession = 's_' + Date.now();
      currentSessionTitle = '新对话';
      await apiCall('/sessions', {method:'POST', body:JSON.stringify({session_id:currentSession, title:'新对话'})});
    }
    rememberSession();
    document.getElementById('archiveToggle').textContent = showArchived ? '返回进行中' : '查看已归档';
    document.getElementById('sessionModeLabel').textContent = showArchived ? '已归档对话' : '进行中对话';
    initialized = true;
    await Promise.all([loadDocuments(), loadTimeline(), loadChatMessages()]);
    document.getElementById('sendBtn').disabled = false;
  } catch (e) {
    document.getElementById('chatMessages').textContent = '初始化失败，请确认服务已启动后刷新：' + e.message;
  }
}
initialize();
